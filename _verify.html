<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>검증용 뷰포트 미리보기 (임시)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0d11; color: #e7e9ee;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
  .wrap { display: flex; gap: 16px; padding: 14px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .cap { color: #9aa3b4; font-weight: 700; letter-spacing: -.01em; }
  iframe { border: 1px solid #2a2f3a; border-radius: 12px; background: #fff; display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <div class="cap">Galaxy Z Fold7 — 접음 (390 × 844)</div>
      <iframe id="phone" src="./?frame=phone" width="390" height="844" title="모바일 뷰"></iframe>
    </div>
    <div class="col">
      <div class="cap">Galaxy Z Fold7 — 펼침 (800 × 900)</div>
      <iframe id="fold" src="./?frame=fold" width="800" height="900" title="폴드 펼침 뷰"></iframe>
    </div>
  </div>
</body>
</html>
